[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "SimpleBoard"
dynamic = ["version", "dependencies"]
description = "An offline Windows whiteboard for pen input, local editing and presentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
keywords = ["whiteboard", "pyside6", "windows-ink", "surface-pen", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Topic :: Education",
]

[project.gui-scripts]
simpleboard = "whiteboard.app:main"

[tool.setuptools]
packages = ["whiteboard"]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt", "licenses/**/*"]

[tool.setuptools.dynamic]
version = {attr = "whiteboard.__version__"}
dependencies = {file = ["requirements.txt"]}
